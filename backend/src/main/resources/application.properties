# ===================================================================
# BusGo Spring Boot Configuration
# ===================================================================
server.port=${SERVER_PORT:8080}
spring.application.name=busgo-backend

# MySQL Database (Supports environment variable overrides with defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/busgo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Settings
busgo.jwt.secret=${JWT_SECRET}
busgo.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
busgo.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
